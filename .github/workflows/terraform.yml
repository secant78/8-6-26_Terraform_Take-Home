name: Terraform - AWS Dev Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'environments/aws/dev/**'
      - 'modules/aws/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'environments/aws/dev/**'
      - 'modules/aws/**'
  workflow_dispatch:

permissions:
  id-token: write # Mandatory for OIDC token retrieval
  contents: read  # Mandatory for repository checkout

jobs:
  terraform:
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/aws/dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "latest"

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::866934333672:role/sean-terraform-project-oidc-role
          aws-region: us-east-2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Plan
        run: terraform plan -no-color

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -no-color